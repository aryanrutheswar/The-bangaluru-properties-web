<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Bangalore Properties | Verified Rental Homes & Apartments in Bengaluru</title>
  <meta name="description"
    content="Discover premium 1BHK, 2BHK, 3BHK rental apartments, luxury villas, and co-living spaces across Bangalore. Verified owners, 0% brokerage options, and instant visit booking." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="./src/style.css" />
</head>

<body>
  <div id="app">
    <!-- Header Mounted Here -->
    <div id="header-root"></div>

    <!-- Hero Section Mounted Here -->
    <div id="hero-root"></div>

    <!-- Main Content Container: Filters & Property Grid -->
    <main class="main-container">
      <div class="layout-grid">
        <!-- Sidebar Filters -->
        <aside id="filters-root" class="filters-sidebar"></aside>

        <!-- Main Property Content -->
        <section class="properties-section">
          <!-- Quick Bar (Sort, View Mode Toggle, Counter) -->
          <div id="quick-bar-root" class="quick-bar"></div>

          <!-- Property Cards Grid -->
          <div id="property-grid-root" class="property-grid"></div>
        </section>
      </div>
    </main>

    <!-- Neighborhood & Tech Hub Distance Guide -->
    <section id="guide-root" class="guide-section"></section>

    <!-- Interactive Rent & Deposit Calculator -->
    <section id="calculator-root" class="calculator-section"></section>

    <!-- Footer Mounted Here -->
    <footer id="footer-root"></footer>

    <!-- Modals Mount Point -->
    <div id="modal-root"></div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
