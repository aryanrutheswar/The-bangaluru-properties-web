<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Bangalore Properties | Verified Rental Homes & Apartments in Bengaluru</title>
  <meta name="description"
    content="Discover premium 1BHK, 2BHK, 3BHK rental apartments, luxury villas, and co-living spaces across Bangalore. Verified owners, 0% brokerage options, and instant visit booking." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="./src/style.css" />
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>

<body>
  <div id="app">
    <!-- Header Mounted Here -->
    <div id="header-root"></div>

    <!-- Hero Section Mounted Here -->
    <div id="hero-root"></div>

    <!-- Main Content Container: Filters & Property Grid -->
    <main class="main-container">
      <div class="layout-grid">
        <!-- Sidebar Filters -->
        <aside id="filters-root" class="filters-sidebar"></aside>

        <!-- Main Property Content -->
        <section class="properties-section">
          <!-- Quick Bar (Sort, View Mode Toggle, Counter) -->
          <div id="quick-bar-root" class="quick-bar"></div>

          <!-- Property Cards Grid -->
          <div id="property-grid-root" class="property-grid"></div>
        </section>
      </div>
    </main>

    <!-- Footer Mounted Here -->
    <footer id="footer-root"></footer>

    <!-- Modals Mount Point -->
    <div id="modal-root"></div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Floating Book a Call Action Button -->
    <button id="floating-btn-book-call" class="floating-call-btn" title="Book a Callback with Proprietor V. RAMANA">
      <i class="fa-solid fa-phone-volume"></i>
      <span>Book a Call</span>
    </button>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
